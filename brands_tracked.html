<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brands Tracked by AIM | Bourbon Pourcast</title><link rel="stylesheet" href="product_details.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f4ef;color:#171717}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#111;color:#fff;padding:28px;border-radius:18px}.hero b{color:#d5aa52}.back{color:#e1bd67}.search{width:min(520px,100%);box-sizing:border-box;margin:20px 0;padding:13px 15px;border:1px solid #bbb;border-radius:11px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.product{background:#fff;border:1px solid #ddd;border-radius:15px;padding:17px}.product h3{margin:0 0 10px;font-size:17px}.meta{color:#68635a;font-size:13px}.count{color:#666;margin-bottom:14px}.empty{padding:24px;background:#fff;border-radius:15px;color:#777}.powered{text-align:center;margin:28px 0;color:#666;font-size:13px}</style></head><body><div class="wrap"><div class="hero"><a class="back" href="aim_dashboard.html">← AIM Details</a><h1>Brands Tracked by <b>AIM</b></h1><p>Explore the allocated and hard-to-find products currently monitored by Bourbon Pourcast.</p></div><input class="search" id="productSearch" placeholder="Search products, suppliers, or aliases"><div class="count" id="count"></div><div class="grid" id="products"></div><div class="powered"><b>Powered by AIM™</b> — Allocation Intelligence Model</div></div><script src="product_details.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));AIMProducts.ready.then(()=>{const all=AIMProducts.getAll(),q=document.getElementById('productSearch');function render(){const term=q.value.toLowerCase().trim(),rows=all.filter(p=>JSON.stringify(p).toLowerCase().includes(term));document.getElementById('count').textContent=`${rows.length} product${rows.length===1?'':'s'} shown`;document.getElementById('products').innerHTML=rows.length?rows.map(p=>`<article class="product"><h3><a href="?product=${encodeURIComponent(p.product_id)}" class="aim-product-link" data-product-id="${esc(p.product_id)}">${esc(p.name)}</a></h3><div class="meta">${p.proof?`${esc(p.proof)} proof · `:''}${p.bottle_size?`${esc(p.bottle_size)} · `:''}${p.classification?esc(p.classification):'Tracked by AIM'}</div></article>`).join(''):'<div class="empty">No matching tracked products.</div>'}q.oninput=render;render()}).catch(()=>document.getElementById('products').innerHTML='<div class="empty">Product intelligence is temporarily unavailable.</div>');</script></body></html>
